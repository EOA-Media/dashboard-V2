<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:0.1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="110" ry="110" fill="#07091A"/>

  <!-- Gradient fill layer -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bgGrad)" opacity="0.9"/>

  <!-- Subtle inner highlight -->
  <rect x="1" y="1" width="510" height="510" rx="109" ry="109" fill="none" stroke="url(#glowGrad)" stroke-width="2"/>

  <!-- Radio / signal waves icon centered at 256,256 -->
  <!-- Outer arc left -->
  <path d="M 180 180 A 108 108 0 0 0 180 332" fill="none" stroke="white" stroke-width="28" stroke-linecap="round" opacity="0.9" filter="url(#glow)"/>
  <!-- Outer arc right -->
  <path d="M 332 180 A 108 108 0 0 1 332 332" fill="none" stroke="white" stroke-width="28" stroke-linecap="round" opacity="0.9" filter="url(#glow)"/>
  <!-- Inner arc left -->
  <path d="M 210 210 A 65 65 0 0 0 210 302" fill="none" stroke="white" stroke-width="24" stroke-linecap="round" opacity="0.85"/>
  <!-- Inner arc right -->
  <path d="M 302 210 A 65 65 0 0 1 302 302" fill="none" stroke="white" stroke-width="24" stroke-linecap="round" opacity="0.85"/>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="22" fill="white" filter="url(#glow)"/>
</svg>
